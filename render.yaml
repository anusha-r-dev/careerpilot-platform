databases:
  - name: careerpilot-postgres
    databaseName: careerpilot
    user: careerpilot
    plan: free
    region: singapore

services:
  - type: web
    name: careerpilot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerpilot-postgres
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_SERVE_STATIC_FILES
        value: true
      - key: SEED_DEMO_DATA
        value: true
      - key: WEB_CONCURRENCY
        value: 1
      - key: RAILS_MAX_THREADS
        value: 5
